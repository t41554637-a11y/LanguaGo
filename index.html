<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LanguaGo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <h1>LanguaGo 🦖</h1>
    <p id="dino">Привет! Давай сохраним серию дня!</p>
  </header>
  <section class="card">
    <h2>Серия дня</h2>
    <div id="streak">0 дней</div>
    <div id="xp">XP: 0</div>
  </section>
  <section class="card">
    <h2>Выбери язык</h2>
    <div id="languages"></div>
  </section>
  <section class="card">
    <h2>Урок</h2>
    <div id="lesson"></div>
    <button id="speak">🔊 Прослушать</button>
    <button id="complete">✅ Завершить урок</button>
  </section>
  <section class="card">
    <h2>Словарь</h2>
    <ul id="dictionary"></ul>
  </section>
  <section class="card">
    <h2>Здоровый образ жизни</h2>
    <p>Сделай 30-секундную разминку и выпей воды.</p>
    <button id="health">Отметить выполненным</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
